    post:
      operationId: rerunCoding
      tags: [Candidates]
      summary: Read the coding profiles again
      description: |
        Reads the candidate's coding profiles (Codeforces, LeetCode, CodeChef) again, then rebuilds the report, which
        waits for these checks. No project is tested again.
      parameters: [{ $ref: '#/components/parameters/CandidateId' }]
      responses:
        '202':
          description: Queued.
          content:
