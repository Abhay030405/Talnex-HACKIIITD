  /v1/live/{kind}/{id}:
    get:
      operationId: getLive
      tags: [Live]
      summary: Watch a check live
      description: |
        A Server-Sent Events stream of what TalNex is doing on one subject. The owner only. For an `event` it streams
        every team of the event; for a `candidate`, every project on the resume.

        **Order.** First `event: replay.start`, then up to 400 saved events (oldest first), then
        `event: replay.done`, then live events as they happen. A comment line `: ping` arrives every 15 seconds. A
        reconnecting viewer gets a fresh replay, so start your list again at `replay.start`.

        **Each event** is `event: KIND` and `data: JSON` with `v`, `at`, `kind`, `subject` (`kind`, `id`), `stage`,
        `claim_id`, `job_id`, `run_number` and `data`. Storage keys in `data` become short-lived `proof_url` or
        `proof_urls` links.

        **Kinds** (`docs/live_events.md`):

        | kind | when | data |
        |---|---|---|
        | `stage.started` | a pipeline stage starts | `try_number` |
        | `stage.finished` | a stage ends | `seconds`, `skipped`, `reason` |
        | `stage.failed` | a stage hit an error | `status` (retrying or failed), `error` |
        | `claims.queued` | live testing starts for a subject | `total`, `todo`, `claims` (id, text) |
        | `claim.started` | one claim starts | `text`, `group`, `importance`, `test_type`, `steps` |
        | `ladder` | each rung of the never-blame ladder | `line` |
        | `run.started` | a browser run starts | `try_number`, `test_type`, `steps`, `expected_result` |
        | `reason` | the agent's reason for its next move | `step`, `text`, `looked_at_picture` |
        | `step.record` | an action was done (screenshot taken) | `number`, `label`, `expected`, `observed`, `proof_url`, `box`, `url` |
        | `step.result` | a plan step ended | `step`, `steps`, `result` (done, failed or blocked), `observed` |
        | `run.outcome` | the run's own conclusion | `outcome`, `observed`, `stop_reason`, `actions` |
        | `run.finished` | the browser closed | `outcome`, `reason`, `actions`, `cost_usd` |
        | `check.started` | the blind proof check starts | `images` |
        | `check` | the blind proof check answered | `outcome`, `seen`, `images` |
        | `verdict` | a claim's final result was saved | `verdict`, `confidence`, `reason`, `proof_urls`, `second_check_agreed` |

        A claim is never broken before its `verdict` event. The interactive playground cannot show a stream: use
        `curl -N` or the MCP server's `watch_live`.
      parameters:
        - name: kind
          in: path
          required: true
          description: What to watch.
          schema: { type: string, enum: [project, candidate_project, candidate, event] }
        - { name: id, in: path, required: true, description: "The id of that project, resume project, candidate or event.", schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The event stream. It stays open until the viewer leaves.
          content:
            text/event-stream:
              schema:
                type: string
                description: Server-Sent Events, one event per blank-line-separated block.
              example: |
                event: replay.start
                data: {}

                event: stage.started
                data: {"v":1,"at":"2026-10-24T16:45:55.103Z","kind":"stage.started","stage":"precheck","subject":{"kind":"project","id":"b93b6f22-5c31-43db-bd4c-a41598568007"},"data":{"try_number":1}}

                event: replay.done
                data: {}

                : ping
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: Not yours, not found, or an unknown kind.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: unknown kind of subject }
        '503':
          description: The live view is switched off on this API.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /v1/sms/incoming:
    post:
      operationId: incomingSms
      tags: [SMS gateway]
      summary: The team phone forwards a text message
      description: |
        Called only by the SMS Relay phone app (`mobile/`) when the team SIM receives a one-time code during sign-up.
        No user token: the phone sends the gateway key in `X-Gateway-Key`. Messages are personal data and are cleared
        after a short time.
      security:
        - gatewayKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SmsMessage' }
      responses:
        '202':
          description: Saved.
        '400':
          description: A missing, too long or badly formed field.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: from and body are required }
        '401':
          description: The gateway key is wrong.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: wrong gateway key }
        '429':
          description: Too many messages in a short time.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "too many messages, slow down" }
        '503':
          description: Phone sign-up is switched off (no gateway key set on the API).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

