      tags: [Dev]
      summary: Names for live subjects (dev only)
      description: '**Dev only, no sign-in.** Maps subject ids to the names people know them by, per kind.'
      security: []
      responses:
        '200':
          description: For each kind (project, candidate_project, candidate, event), id to name.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties: { type: string }
              example: { project: { b93b6f22-5c31-43db-bd4c-a41598568007: TinyTools } }
        '404': { $ref: '#/components/responses/DevOff' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A JWT signed with HS256 and the API's `AUTH_SECRET`, exactly as the website signs it (`web/lib/token.ts`).
        Header `alg: HS256, typ: JWT`. Claims:

        - `email` (required): the account, trimmed and lower case. A new email creates the account.
        - `name`: the person's name, or empty.
        - `role`: `organizer` or `recruiter`. Organizer routes refuse a recruiter and the other way round (403).
        - `iat`: when it was signed. `exp` (required): when it stops working; the website uses 120 seconds.

        Signing with the shared secret is for the website, the MCP server and local testing. For the playground, the
        docs site can mint a test token when run with `TALNEX_DOCS_DEV_TOKENS=true`.
    gatewayKey:
      type: apiKey
      in: header
      name: X-Gateway-Key
      description: The SMS gateway key (`SMS_GATEWAY_KEY`) shared with the team phone. Only for the SMS route.

  parameters:
    EventId:
      { name: id, in: path, required: true, description: The event id., schema: { type: string, format: uuid } }
    ProjectId:
      { name: id, in: path, required: true, description: The hackathon project (team) id., schema: { type: string, format: uuid } }
    CandidateId:
      { name: id, in: path, required: true, description: The candidate id., schema: { type: string, format: uuid } }
    CandidateProjectId:
      { name: id, in: path, required: true, description: The id of one project on a candidate's resume., schema: { type: string, format: uuid } }

  requestBodies:
    Stages:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [stages]
            properties:
              stages: { type: array, items: { type: string }, example: [live_test] }
    CustomTest:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [instruction]
            properties:
              instruction:
                type: string
                maxLength: 500
                description: What to try on the live site, in plain words, up to 500 characters.
                example: Add three todos, reload the page, and check they are still there.
    Ask:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [question]
            properties:
              question:
                type: string
                maxLength: 1000
                description: The question, up to 1000 characters.
                example: Which claims could not be tested, and why?
    Question:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [question]
            properties:
              question:
                type: string
                description: The question, for example how does the login work.
                example: How does the login work?
        multipart/form-data:
          schema:
            type: object
            required: [audio]
            properties:
              audio:
                type: string
                format: binary
                description: A recorded question (WebM, Ogg, MP4/M4A, WAV or MP3). Off when the API has no file storage.

  responses:
    WalkthroughQueued:
      description: The question was queued.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/WalkthroughQueued' }
    QuestionBad:
      description: No question, too long, or a bad recording.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: question is required }
    TooManyQuestions:
      description: The daily limit of questions for this project is reached.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    AskQueued:
      description: The question was queued; the answer usually takes a few seconds.
      content:
        application/json:
          schema:
            type: object
            properties:
              id: { type: string, format: uuid, description: The question's id. }
    AskBad:
      description: No question, or longer than 1000 characters.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: ask a question of up to 1000 characters }
    CustomTestBad:
      description: No description of the test, or longer than 500 characters.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: describe the test in up to 500 characters }
    CustomTestList:
      description: The custom tests, newest first (at most 20).
      content:
        application/json:
          schema:
            type: array
            items: { $ref: '#/components/schemas/CustomTest' }
    AskList:
      description: The questions, newest first.
      content:
        application/json:
          schema:
            type: array
            items: { $ref: '#/components/schemas/Ask' }
    BadInput:
      description: The body is missing, not valid JSON, has an unknown field, or breaks a rule. The message says which.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: "starts_at and ends_at are required, and ends_at must be after starts_at" }
    Unauthorized:
      description: No token, an expired token, or one not signed with this API's `AUTH_SECRET`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: sign in required }
    WrongRole:
      description: The route is for the other kind of account (organizer or recruiter).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: this page is for organizer accounts }
    RoleTaken:
      description: The token's role differs from the role this email already has.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: this email already has a recruiter account }
    NotFound:
      description: It does not exist, or it belongs to another account. The two look the same on purpose.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: event not found }
    DevOff:
      description: The dev routes are off (`ENABLE_DEV_ENDPOINTS` is not true).
      content:
        text/plain:
          schema: { type: string }

  schemas:
    Job:
      type: object
      properties:
        id: { type: string, format: uuid }
        pipeline: { type: string }
        stage: { type: string }
        target_type: { type: string }
        target_id: { type: string, format: uuid }
        project: { type: string }
        run: { type: integer }
        status: { type: string, enum: [queued, running, retrying, done, failed] }
        tries: { type: integer }
        max_tries: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        seconds: { type: number }
        error: { type: string }
        result: { type: object }
        after_stages: { type: array, items: { type: string }, description: The stages this one waits for, to draw the pipeline. }
    Error:
      type: object
      description: Every error, in plain words.
      required: [error]
      properties:
        error: { type: string, description: "What went wrong, safe to show.", example: event not found }

    Status:
      type: object
      properties:
        status: { type: string, description: ok or ready. }

    Me:
      type: object
      properties:
        id: { type: string, format: uuid, description: The account id. }
        email: { type: string, format: email, description: "The account's email, lower case.", example: organizer@talnex.test }

    RoleLevel:
      type: string
      enum: [fresher, junior, mid, senior]
      description: How features are scored. A fresher is not expected to build what a senior would.

    Criterion:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string, description: The criterion's name., example: Core features }
        description: { type: string, description: What the judges look for. }
        weight: { type: number, description: "Its weight in the weighted total, above 0.", example: 3 }

    NewCriterion:
      type: object
      additionalProperties: false
      required: [name, weight]
      properties:
        name: { type: string, description: A unique name., example: Core features }
        description: { type: string, description: What the judges look for., example: "The converter, todos and timer work" }
        weight: { type: number, exclusiveMinimum: 0, description: Above 0., example: 3 }

    Event:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Campus Hack 2026 }
        mode:
          type: string
          enum: [open_theme, fixed_problem]
          description: open_theme reads each team's own features; fixed_problem scores everyone on the criteria.
        role_level: { $ref: '#/components/schemas/RoleLevel' }
        starts_at: { type: string, format: date-time, description: When the event started. Code from before it is flagged. }
        ends_at: { type: string, format: date-time, description: When it ended. }
        sponsor_tools: { type: array, items: { type: string }, description: Sponsor technology teams were asked to use. }
        criteria:
          type: [array, 'null']
          items: { $ref: '#/components/schemas/Criterion' }
          description: Fixed-problem events only.
        created_at: { type: string, format: date-time }

    NewEvent:
      type: object
      additionalProperties: false
      required: [name, mode, starts_at, ends_at]
      properties:
        name: { type: string, description: Required., example: Campus Hack 2026 }
        mode: { type: string, enum: [open_theme, fixed_problem], example: fixed_problem }
        role_level: { allOf: [{ $ref: '#/components/schemas/RoleLevel' }], description: Default fresher. }
        starts_at: { type: string, format: date-time, example: '2026-10-23T09:00:00Z' }
        ends_at: { type: string, format: date-time, description: Must be after starts_at., example: '2026-10-24T18:00:00Z' }
        sponsor_tools: { type: array, items: { type: string }, example: [] }
        criteria:
          type: array
          items: { $ref: '#/components/schemas/NewCriterion' }
          description: At least one for fixed_problem; none for open_theme.
          example: [{ name: Core features, description: The main tools work, weight: 3 }, { name: Ease of use, description: '', weight: 1 }]
        brief:
          type: string
          maxLength: 20000
          description: The problem statement or theme the judges give. It reaches the test prompts as data, never as instructions.
        checks:
          type: object
          description: Which checks run for this event, each true or false. Empty runs the usual checks.
          additionalProperties: { type: boolean }

    EventRunStarted:
      type: object
      properties:
        started: { type: array, items: { type: string, format: uuid }, description: The teams whose first check was queued. }
        skipped: { type: array, items: { type: string, format: uuid }, description: Teams already checked before. }

    Project:
      type: object
      properties:
        id: { type: string, format: uuid }
        event_id: { type: string, format: uuid }
        team_name: { type: string, example: TinyTools }
        video_url: { type: string, description: "The demo video, or empty." }
        live_url: { type: string, description: "The live site, or empty.", example: https://talnex-honest.vercel.app }
        repo_url: { type: string, description: "The public GitHub repository, or empty." }
        test_login_ref: { type: string, description: "A name in TinyFish Vault for a test login, never a password." }
        team_github_handles: { type: array, items: { type: string }, description: The team's GitHub accounts. }
        status:
          type: string
          description: submitted, prechecking, reading, testing, checking, scoring, done, or done_with_gaps.
          example: submitted
        status_detail: { type: string, description: A plain-words note on the status. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    NewProject:
      type: object
      additionalProperties: false
      required: [team_name]
      description: Give at least one of video_url, live_url or repo_url. Links must start with http:// or https://.
      properties:
        team_name: { type: string, example: TinyTools }
        live_url: { type: string, example: https://talnex-honest.vercel.app }
        repo_url: { type: string, example: '' }
        video_url: { type: string, example: '' }
        test_login_ref: { type: string, description: A TinyFish Vault name for a test login. Never a password. }
        team_github_handles: { type: array, items: { type: string }, maxItems: 10, description: GitHub account names. }
        abstract:
          type: string
          description: The team's own short description of what they built. It reaches the test prompts as data, never as instructions.

    ProjectRunStarted:
      type: object
      properties:
        project_id: { type: string, format: uuid }
        run: { type: integer, description: The run number that was queued (1 for the first check)., example: 2 }

    Verdict:
      type: [string, 'null']
      enum: [works, partly_works, broken, could_not_test, reviewed_from_code, null]
      description: |
        works, partly_works, broken (only after the never-blame ladder), could_not_test (left out of the score, never
        counts against anyone), reviewed_from_code (read, not run; capped at 7 out of 10).

    ProofStep:
      type: object
      properties:
        step: { type: integer }
        action: { type: string, description: What the agent did. }
        observed: { type: [string, 'null'], description: What was on screen afterwards. }
        kind: { type: string, enum: [screen, http, command], description: "A screenshot, a saved request, or a command's output." }
        test_type: { type: [string, 'null'] }
        track: { type: [string, 'null'], description: live or sandbox. }
        proof_url: { type: string, description: A short-lived link to the proof file. Missing when there is none. }

    Feature:
      type: object
      description: One claim and what happened when it was tested.
      properties:
        claim_id: { type: string, format: uuid }
        text: { type: string, example: "Convert between USD, EUR, GBP and INR." }
        group: { type: [string, 'null'], description: "Access, Core, Logic, Reliability, a criterion, or other." }
        importance: { type: number }
        testable: { type: boolean }
        untestable_reason: { type: [string, 'null'] }
        verdict: { $ref: '#/components/schemas/Verdict' }
        confidence: { type: [string, 'null'], enum: [high, medium, low, disagree, null] }
        reason: { type: [string, 'null'], description: "Why, in plain words." }
        score10: { type: [number, 'null'], description: The feature's score out of 10; null when not tested. }
        score_reason: { type: [string, 'null'] }
        proof: { type: array, items: { $ref: '#/components/schemas/ProofStep' } }
        code_review: { type: [object, 'null'], description: "For claims reviewed from code, not run." }
        authorship: { type: [object, 'null'], description: Which GitHub account wrote the code behind it. }

    Flag:
      type: object
      description: A red flag. Shown beside the score, never subtracted from it.
      properties:
        type: { type: string, example: built_before_event }
        level: { type: string, enum: [info, review, strong] }
        reason: { type: string }

    TalnexScore:
      type: object
      properties:
        score10: { type: [number, 'null'], description: The TalNex score out of 10 over the features that were tested., example: 9.6 }
        coverage: { type: number, description: Percent of features that could be scored., example: 100 }
        features_scored: { type: integer }
        features_total: { type: integer }
        low_coverage: { type: boolean, description: True when too little could be tested to lean on the score. }
        confidence: { type: [string, 'null'] }

    CardGroup:
      type: object
      properties:
        group: { type: string }
        kind: { type: string, description: "standard, backend, other or criterion." }
        score: { type: [number, 'null'] }
        coverage: { type: number }
        confidence: { type: [string, 'null'] }
        claims_used: { type: integer }
        low_coverage: { type: boolean }

    ProofCard:
      type: object
      description: The hackathon proof card, built by the project_report stage.
      properties:
        version: { type: integer }
        project_id: { type: string, format: uuid }
        generated_at: { type: string, format: date-time }
        team_name: { type: string, example: TinyTools }
        status: { type: string }
        links:
          type: object
          properties:
            video: { type: [string, 'null'] }
            live: { type: [string, 'null'] }
            repo: { type: [string, 'null'] }
        event: { type: object, description: "The event's id, name, mode, role level and dates." }
        criteria: { type: array, items: { $ref: '#/components/schemas/NewCriterion' } }
        talnex: { $ref: '#/components/schemas/TalnexScore' }
        weighted_total:
          type: [object, 'null']
          description: Fixed-problem events only, always shown with its label.
          properties:
            score: { type: [number, 'null'] }
            weight_covered: { type: number }
            criteria_used: { type: integer }
            criteria_total: { type: integer }
            label: { type: string }
        groups: { type: array, items: { $ref: '#/components/schemas/CardGroup' } }
        features: { type: array, items: { $ref: '#/components/schemas/Feature' } }
        flags: { type: array, items: { $ref: '#/components/schemas/Flag' } }
        checks:
          type: array
          description: Checks and what became of them (for example a stage that could not run, and why).
          items:
            type: object
            properties:
              stage: { type: string }
              status: { type: string }
              reason: { type: [string, 'null'] }
        ai_opinion:
          type: [object, 'null']
          description: UI and innovation opinion. Always labelled "AI opinion, not tested proof"; never part of a score.
        who_built_what: { type: [array, 'null'], items: { type: object } }
        has_gaps: { type: boolean, description: True when something could not be tested; the card says what and why. }
        notes: { type: array, items: { type: string } }

    EventOverview:
      type: object
      properties:
        event: { $ref: '#/components/schemas/Event' }
        projects:
          type: array
          description: Ordered by team name, never by score.
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              team_name: { type: string }
              status: { type: string }
              has_video: { type: boolean }
              has_live: { type: boolean }
              has_repo: { type: boolean }
              talnex_score10: { type: [number, 'null'] }
              coverage: { type: [number, 'null'] }
              weighted_total: { type: [number, 'null'] }
              groups:
                type: array
                items:
                  type: object
                  properties:
                    group: { type: string }
                    score: { type: [number, 'null'] }
                    coverage: { type: number }
                    low_coverage: { type: boolean }
              flags:
                type: object
                description: How many flags of each level (info, review, strong).
                additionalProperties: { type: integer }
              report_ready: { type: boolean }
              run_seconds: { type: [number, 'null'], description: How long the latest check took. }
              run_cost_usd: { type: [number, 'null'], description: What the latest check cost. }

    BestTeam:
      type: object
      description: One of up to three teams that built a feature best.
      properties:
        project_id: { type: string, format: uuid }
        team_name: { type: string }
        claim_id: { type: string }
        claim_text: { type: string }
        verdict: { $ref: '#/components/schemas/Verdict' }
        confidence: { type: [string, 'null'] }
        feature_score: { type: [number, 'null'] }
        reason: { type: [string, 'null'] }
        proof_urls: { type: array, items: { type: string } }
        label: { type: [string, 'null'] }

    EventCompare:
      type: object
      properties:
        ready: { type: boolean, description: False until every team's check has finished. }
        features:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              best_teams: { type: array, maxItems: 3, items: { $ref: '#/components/schemas/BestTeam' } }
        group_bests:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              best_teams: { type: array, maxItems: 3, items: { $ref: '#/components/schemas/BestTeam' } }
        copy_pairs:
          type: array
          items:
            type: object
            properties:
              team_a: { type: object, properties: { id: { type: string }, name: { type: string } } }
              team_b: { type: object, properties: { id: { type: string }, name: { type: string } } }
              shared_pct: { type: number, description: How much of the code has the same shape. }
              level: { type: [string, 'null'], enum: [info, review, strong, null] }
              matching_files: { description: The files that look alike. }
        notes: { type: array, items: { type: string } }

    RoleCriterion:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        weight: { type: number, exclusiveMinimum: 0 }

    NewRole:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: { type: string, example: Backend intern }
        job_description: { type: string }
        person_wanted: { type: string, description: "The kind of person wanted, in the recruiter's words." }
        skills: { type: array, items: { type: string } }
        role_level: { $ref: '#/components/schemas/RoleLevel' }
        criteria: { type: array, items: { $ref: '#/components/schemas/RoleCriterion' } }
        checks:
          type: object
          description: Which checks to run (live_test, code_review, coding_profiles, linkedin), each true or false.
          additionalProperties: { type: boolean }
        auto_confirm: { type: boolean, description: Start the paid checks as soon as a resume is read. Default true. }

    Role:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        job_description: { type: string }
        person_wanted: { type: string }
        skills: { type: array, items: { type: string } }
        role_level: { $ref: '#/components/schemas/RoleLevel' }
        criteria: { type: array, items: { $ref: '#/components/schemas/RoleCriterion' } }
        checks: { type: object, additionalProperties: { type: boolean } }
        auto_confirm: { type: boolean }
        candidate_count: { type: integer }
        created_at: { type: string, format: date-time }
        candidates: { type: array, items: { $ref: '#/components/schemas/Candidate' }, description: Only on GET of one role. }

    Candidate:
      type: object
      properties:
        id: { type: string, format: uuid }
        label: { type: string, description: A label; no real name needed. }
        role_level: { $ref: '#/components/schemas/RoleLevel' }
        role_id: { type: string, format: uuid, description: "The role the candidate sits under, when any." }
        coding_handles: { type: object, additionalProperties: { type: string } }
        status: { type: string, description: For example new, reading, awaiting_confirmation, checking, done. }
        created_at: { type: string, format: date-time }

    NewCandidate:
      type: object
      additionalProperties: false
      properties:
        label: { type: string, example: Candidate 12 }
        role_level: { allOf: [{ $ref: '#/components/schemas/RoleLevel' }], description: Default fresher. }
        coding_handles:
          type: object
          description: Handles on codeforces, leetcode or codechef.
          additionalProperties: { type: string }
          example: { codeforces: tourist }
        role_id: { type: string, description: "A role id, or empty for none." }

    ResumeAccepted:
      type: object
      properties:
        candidate_id: { type: string, format: uuid }
        run: { type: integer }

    FoundProject:
      type: object
      properties:
        id: { type: string, format: uuid, description: Set for a project the reader found; leave out for a new one. }
        name: { type: string, example: TinyTools }
        live_url: { type: string }
        repo_url: { type: string }
        video_url: { type: string }
        bullets: { type: array, items: { type: string }, description: Read only. The resume lines it came from. }

    Found:
      type: object
      properties:
        status: { type: string, example: awaiting_confirmation }
        status_detail: { type: string }
        role_level: { $ref: '#/components/schemas/RoleLevel' }
        projects: { type: array, items: { $ref: '#/components/schemas/FoundProject' } }
        coding_handles: { type: object, additionalProperties: { type: string } }
        coding_links: { type: object, additionalProperties: { type: string } }

    Confirmation:
      type: object
      additionalProperties: false
      properties:
        projects: { type: array, items: { $ref: '#/components/schemas/FoundProject' }, description: The final list to check. }
        coding_profiles:
          type: object
          description: Site to handle or profile link. An empty value removes that profile.
          additionalProperties: { type: string }

    ConfirmStarted:
      type: object
      properties:
        candidate_id: { type: string, format: uuid }
        run: { type: integer }
        projects: { type: integer, description: How many projects will be checked. }

    ProgressStage:
      type: object
      properties:
        name: { type: string, example: resume_read }
        state: { type: string, enum: [waiting, running, retrying, done, failed] }
        note: { type: string }

    Progress:
      type: object
      properties:
        status: { type: string }
        status_detail: { type: string }
        stages: { type: array, items: { $ref: '#/components/schemas/ProgressStage' } }
        projects:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              stages: { type: array, items: { $ref: '#/components/schemas/ProgressStage' } }
        report_ready: { type: boolean }

    Report:
      type: object
      description: The recruiter proof report.
      properties:
        version: { type: integer }
        candidate_id: { type: string, format: uuid }
        generated_at: { type: string, format: date-time }
        role_level: { $ref: '#/components/schemas/RoleLevel' }
        has_gaps: { type: boolean }
        time_saved:
          type: object
          properties:
            manual_minutes_estimate: { type: number }
            talnex_minutes: { type: number }
            saved_minutes: { type: number }
        projects:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              live_url: { type: [string, 'null'] }
              repo_url: { type: [string, 'null'] }
              status: { type: string, enum: [tested, could_not_test, no_live_link] }
              status_reason: { type: string }
              talnex: { oneOf: [{ $ref: '#/components/schemas/TalnexScore' }, { type: 'null' }] }
              features: { type: array, items: { $ref: '#/components/schemas/Feature' } }
              flags: { type: array, items: { $ref: '#/components/schemas/Flag' } }
              originality:
                type: [object, 'null']
                description: Whether the repository was found, when it was created and pushed, forks and languages.
        coding_signals:
          type: array
          items:
            type: object
            properties:
              site: { type: string }
              signal: { type: string }
              weight: { type: string, description: "not_suspicious, medium or strong." }
              contest: { type: [string, 'null'] }
              evidence: { type: object }
        flags: { type: array, items: { $ref: '#/components/schemas/Flag' } }
        notes: { type: array, items: { type: string } }
        interview_kit:
          type: array
          description: Questions to ask, each tied to its proof. Things to talk about, never verdicts.
          items:
            type: object
            properties:
              kind: { type: string, enum: [coding, feature, flag, demo] }
              question: { type: string }
              why: { type: string }
              proof: { type: object }

    Ask:
      type: object
      properties:
        id: { type: string, format: uuid }
        question: { type: string }
        status: { type: string, enum: [queued, running, retrying, done, failed] }
        result:
          type: object
          description: Once done, `answer` (plain words) and `action` (a suggested next step, or null). Empty before.
          properties:
            answer: { type: string }
            action: { type: [object, 'null'] }
        asked_at: { type: string, format: date-time }

    CustomTest:
      type: object
      properties:
        id: { type: string, format: uuid }
        instruction: { type: string, description: The test as the reviewer described it. }
        status: { type: string, enum: [queued, running, retrying, done, failed] }
        result:
          type: object
          description: Empty until done. Never part of any score.
          properties:
            verdict: { $ref: '#/components/schemas/Verdict' }
            observed: { type: string, description: What the agent saw happen. }
            expected: { type: string, description: What the planned test expected. }
            steps:
              type: array
              items:
                type: object
                properties:
                  action: { type: string }
                  observed: { type: [string, 'null'] }
                  proof_url: { type: string, description: A short-lived link to the step's screenshot. }
        asked_at: { type: string, format: date-time }

    WalkthroughQueued:
      type: object
      properties:
        id: { type: string, format: uuid, description: Read the answer with this id. }
        status: { type: string, const: queued }

    Walkthrough:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [queued, answering, done, failed] }
        question: { type: [string, 'null'] }
        answer:
          type: [object, 'null']
          description: |
            Once done: the claim it is about, the flow sentences and what was seen, each with proof (code lines,
            screenshots as short-lived view_url links, steps), what was not found in the code, and a spoken version.
        error: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        answered_at: { type: [string, 'null'], format: date-time }

    SmsMessage:
      type: object
      required: [from, body]
      properties:
        from: { type: string, description: The sender's number. }
        body: { type: string, description: The message text. }
        received_at: { type: string, format: date-time, description: "When the phone got it (ISO 8601, not in the future)." }
        device: { type: string, description: Which phone sent it. }

    SelfTestStarted:
      type: object
      properties:
        target: { type: string, format: uuid }
        started_jobs: { type: array, items: { type: string } }

    SelfTestJob:
      type: object
      properties:
        job_type: { type: string }
        runner: { type: string, description: go or python. }
        status: { type: string }
        tries: { type: integer }
        error: { type: string }
