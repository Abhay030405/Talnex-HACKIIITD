openapi: 3.1.0
info:
  title: TalNex API
  version: 0.1.0
  summary: The Go API behind the TalNex website, the MCP server and the phone SMS gateway.
  description: |
    TalNex opens a project's live link, uses it like a real person, and gives proof of what actually works.
    This is the Go API the website calls (`backend/internal/http/server.go`).

    **Sign-in.** Every `/v1` route except the SMS gateway and the dev live view needs `Authorization: Bearer` with a
    short-lived token (see the `bearerAuth` scheme). Results are private to their owner: someone else's event,
    project or candidate answers 404, exactly like one that does not exist, so nothing leaks.

    **Errors** are JSON with one field, `error`, in plain words.

    **Money.** `POST /v1/events/{id}/run`, `POST /v1/projects/{id}/run`, `POST /v1/candidates/{id}/confirm` and
    `POST /v1/candidates/{id}/resume` start paid work (a browser agent and model calls).

    A test (`backend/internal/http/openapi_test.go`) fails if a route registered in `server.go` is missing here.
servers:
  - url: '{origin}'
    description: The TalNex API, by default on port 8080 (`API_PORT`). Change the address to point at another stack.
    variables:
      origin:
        default: http://localhost:8080
security:
  - bearerAuth: []
tags:
  - name: Account
    description: Who the token signs in as.
  - name: Events
    description: Organizer only. Hackathon events and starting their checks.
  - name: Projects
    description: Organizer only. The teams of an event.
  - name: Proof
    description: Organizer only. Proof cards, the event overview and "who built each feature best".
  - name: Candidates
    description: Recruiter only. Hiring roles, candidates, their resumes, confirmation, progress and the proof report.
  - name: Walkthroughs
    description: Ask how a feature of one project works. Answered from the code and the test results, never a score.
  - name: Live
    description: What TalNex is doing right now, as Server-Sent Events (`docs/live_events.md`).
  - name: SMS gateway
    description: The team phone forwards one-time codes it receives. No user token; checked by its gateway key.
  - name: Health
    description: Liveness and readiness checks for Docker and load balancers. No sign-in.
  - name: Dev
    description: |
      **Dev only.** These routes exist only when the API runs with `ENABLE_DEV_ENDPOINTS=true` (local demos and
      tests). They answer 404 in production.

paths:
  /healthz:
    get:
      operationId: healthz
      tags: [Health]
      summary: Is the API process up
      description: Answers as long as the process runs. Does not check the database.
      security: []
      responses:
        '200':
          description: The API is up.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Status' }
              example: { status: ok }

  /readyz:
    get:
      operationId: readyz
      tags: [Health]
      summary: Can the API serve requests
      description: Checks the services behind the API (the database and file storage) within 3 seconds.
      security: []
      responses:
        '200':
          description: Ready.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Status' }
              example: { status: ready }
        '503':
          description: Something the API needs is not reachable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: not ready }

  /v1/me:
    get:
      operationId: getMe
      tags: [Account]
      summary: Who am I
      description: |
        The account the token signs in as. The first call with a new email creates the account, with the token's role.
        Use it to check a token works.
      responses:
        '200':
          description: The signed-in account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/RoleTaken' }

  /v1/auth/register:
    post:
      operationId: registerPassword
      tags: [Account]
      summary: Set a password (create an email and password account)
      description: |
        Called by the website's sign-up form. The token names the email and the role (the sign-in door); the account is
        made with that role if it is new. An email that already has a password is refused: sign in instead. The password
        is stored only as a bcrypt hash and is never returned. Too many refused tries from one address are slowed down.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, minLength: 8, maxLength: 128 }
      responses:
        '201':
          description: The account now has a password.
          content:
            application/json:
              schema:
                type: object
                properties:
                  email: { type: string }
                  role: { type: string, enum: [organizer, recruiter] }
        '400': { description: 'No role in the token, or the password is not 8 to 128 characters.' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/RoleTaken' }
        '409': { description: 'This email already has an account; sign in instead.' }
        '429': { description: 'Too many tries; wait a few minutes.' }

  /v1/auth/password-login:
    post:
      operationId: passwordLogin
      tags: [Account]
      summary: Check an email and password
      description: |
        Called by the website's sign-in form. The token names the email (no role needed). A wrong password and an unknown
        email get the same answer, and an unknown email never creates an account. Five failures within 15 minutes for one
        email, or from one address, are refused for a while (429).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        '200':
          description: The password is right.
          content:
            application/json:
              schema:
                type: object
                properties:
                  email: { type: string }
                  name: { type: string }
                  role: { type: string, enum: [organizer, recruiter, ''] }
        '401': { description: 'Email or password is wrong, or no valid token.' }
        '429': { description: 'Too many failed tries; wait a few minutes.' }

  /v1/events:
    post:
      operationId: createEvent
      tags: [Events]
      summary: Create a hackathon event
      description: |
        Creates an event. Nothing is checked until teams are added and run. A `fixed_problem` event needs at least one
        weighted criterion; an `open_theme` event has none.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewEvent' }
      responses:
        '201':
          description: The new event.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/WrongRole' }
    get:
      operationId: listEvents
      tags: [Events]
      summary: List your events
      description: Every event you own, newest first.
      responses:
        '200':
          description: Your events.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Event' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/WrongRole' }

  /v1/events/{id}:
    get:
      operationId: getEvent
      tags: [Events]
      summary: Get one event
      parameters: [{ $ref: '#/components/parameters/EventId' }]
      responses:
        '200':
          description: The event with its criteria.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/WrongRole' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/events/{id}/run:
    post:
      operationId: runEvent
      tags: [Events]
      summary: Check every new team of an event
      description: |
        **Spends money.** Starts the first check of every team that was never checked. Teams already checked are
        skipped (run one again with `POST /v1/projects/{id}/run`).
      parameters: [{ $ref: '#/components/parameters/EventId' }]
      responses:
        '202':
          description: The checks were queued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventRunStarted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/WrongRole' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/events/{id}/criteria:
    put:
      operationId: updateCriteria
      tags: [Events]
      summary: Change a fixed-problem event's criteria
      description: |
        Replaces the criteria and their weights. Only a `fixed_problem` event has criteria. Proof cards already made
        are scored again with the new weights; nothing is tested again, so this costs nothing.
      parameters: [{ $ref: '#/components/parameters/EventId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [criteria]
              properties:
                criteria:
                  type: array
                  minItems: 1
                  items: { $ref: '#/components/schemas/NewCriterion' }
      responses:
        '200':
          description: The saved criteria.
          content:
            application/json:
              schema:
                type: object
                properties:
                  criteria: { type: array, items: { $ref: '#/components/schemas/Criterion' } }
        '400':
          description: A criterion breaks a rule, or the event is open-theme.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: only a fixed_problem event has criteria }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/WrongRole' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/events/{id}/projects:
    post:
      operationId: createProject
      tags: [Projects]
      summary: Add a team to an event
      description: Adds one team. Give at least one of the live site, the public repository or the demo video.
      parameters: [{ $ref: '#/components/parameters/EventId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewProject' }
      responses:
        '201':
          description: The new team.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/WrongRole' }
        '404': { $ref: '#/components/responses/NotFound' }
    get:
      operationId: listProjects
      tags: [Projects]
      summary: List an event's teams
      parameters: [{ $ref: '#/components/parameters/EventId' }]
      responses:
        '200':
          description: The teams, by name.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Project' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/WrongRole' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/projects/{id}:
    get:
      operationId: getProject
      tags: [Projects]
      summary: Get one team
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      responses:
        '200':
          description: The team, its links and its status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/WrongRole' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/projects/{id}/run:
    post:
      operationId: runProject
      tags: [Projects]
      summary: Check one team now, or again
      description: '**Spends money.** Starts the next run of the check for this team.'
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      responses:
        '202':
          description: The check was queued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectRunStarted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/WrongRole' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: This team is still being checked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: this project is still being checked }

  /v1/projects/{id}/ask:
    post:
      operationId: askProject
      tags: [Walkthroughs]
      summary: Ask TalNex about a team's proof card
      description: |
        Organizer only. A question about the team's results ("which claims could not be tested, and why?"), answered
        from the proof card by one small model call. Read the answer with `GET /v1/projects/{id}/asks`.
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      requestBody: { $ref: '#/components/requestBodies/Ask' }
      responses:
        '202': { $ref: '#/components/responses/AskQueued' }
        '400': { $ref: '#/components/responses/AskBad' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/WrongRole' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/projects/{id}/asks:
    get:
      operationId: listProjectAsks
      tags: [Walkthroughs]
      summary: Questions asked about a team's proof card
      description: Organizer only. Newest first, each with its answer once done.
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      responses:
        '200': { $ref: '#/components/responses/AskList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/WrongRole' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/projects/{id}/custom-test:
    post:
      operationId: customTestProject
      tags: [Walkthroughs]
      summary: Run a custom test on a team's live site
      description: |
        **Spends money.** Organizer only. Ask TalNex to try one thing on the team's live site, described in your own
        words ("add three todos, reload, check they are still there"). The agent plans it, runs it with a screenshot
        per step and says what happened. The result never changes a score. Read it with
        `GET /v1/projects/{id}/custom-tests`.
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      requestBody: { $ref: '#/components/requestBodies/CustomTest' }
      responses:
        '202': { $ref: '#/components/responses/AskQueued' }
        '400': { $ref: '#/components/responses/CustomTestBad' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/WrongRole' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/projects/{id}/custom-tests:
    get:
      operationId: listProjectCustomTests
      tags: [Walkthroughs]
      summary: Custom tests run on a team's site
      description: Organizer only. The latest 20, newest first, each with its result once done.
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      responses:
        '200': { $ref: '#/components/responses/CustomTestList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/WrongRole' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/projects/{id}/proof:
    get:
      operationId: getProjectProof
      tags: [Proof]
      summary: A team's proof card
      description: |
        Every claim with its verdict, score out of 10, reason and proof; group scores; red flags (beside the score,
        never subtracted); the AI opinion (labelled, never part of the score); checks that did not run. Each proof
        step's storage key is swapped for a short-lived `proof_url`.
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      responses:
        '200':
          description: The proof card.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProofCard' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/WrongRole' }
        '404':
          description: Not found, not yours, or the card is not ready yet (`the proof card is not ready yet`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: the proof card is not ready yet }

  /v1/events/{id}/overview:
    get:
      operationId: getEventOverview
      tags: [Proof]
      summary: Every team of an event at a glance
      description: |
        The organizer's dashboard: each team's status, TalNex score, coverage, weighted total, group scores and flag
        counts. Ordered by team name, never by score: TalNex does not rank teams.
      parameters: [{ $ref: '#/components/parameters/EventId' }]
      responses:
        '200':
          description: The event and its teams.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventOverview' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/WrongRole' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/events/{id}/compare:
    get:
      operationId: getEventCompare
      tags: [Proof]
      summary: Who built each feature best
      description: |
        For each feature, up to three teams that built it best (never one winner, no ranking between features), the
        best per group for open-theme events, and the pairs of teams whose code has the same shape. A copy pair is a
        reason for a person to look; TalNex cannot tell who wrote the code first.
      parameters: [{ $ref: '#/components/parameters/EventId' }]
      responses:
        '200':
          description: The comparison. `ready` is false until every team's check has finished.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventCompare' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/WrongRole' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/roles:
    post:
      operationId: createRole
      tags: [Candidates]
      summary: Create a hiring role
      description: |
        A job opening that candidates sit under. With `auto_confirm` (on by default) the paid checks start by
        themselves as soon as a candidate's resume is read.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewRole' }
      responses:
        '201':
          description: The new role.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/WrongRole' }
    get:
      operationId: listRoles
      tags: [Candidates]
      summary: List your hiring roles
      responses:
        '200':
          description: Your roles, each with its candidate count.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Role' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/WrongRole' }

  /v1/roles/{id}:
    get:
      operationId: getRole
      tags: [Candidates]
      summary: Get one role with its candidates
      parameters:
        - { name: id, in: path, required: true, description: The role id., schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The role and the candidates under it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/WrongRole' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateRole
      tags: [Candidates]
      summary: Change a hiring role
      description: Replaces the role's details, criteria, checks and `auto_confirm` with the body. The owner only.
      parameters:
        - { name: id, in: path, required: true, description: The role id., schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewRole' }
      responses:
        '200':
          description: The changed role.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/WrongRole' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/candidates:
    post:
      operationId: createCandidate
      tags: [Candidates]
      summary: Add a candidate
      description: |
        Creates the candidate. Upload the resume next with `POST /v1/candidates/{id}/resume`. Leave `role_id` out (or
        empty) for a candidate under no role.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewCandidate' }
      responses:
        '201':
          description: The new candidate.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Candidate' }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/WrongRole' }
    get:
      operationId: listCandidates
      tags: [Candidates]
      summary: List your candidates
      responses:
        '200':
          description: Your candidates with their status.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Candidate' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/WrongRole' }

  /v1/candidates/{id}:
    get:
      operationId: getCandidate
      tags: [Candidates]
      summary: Get one candidate
      parameters: [{ $ref: '#/components/parameters/CandidateId' }]
      responses:
        '200':
          description: The candidate.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Candidate' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/WrongRole' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteCandidate
      tags: [Candidates]
      summary: Delete a candidate and their files
      description: |
        Deletes the candidate, the resume file, every result and screenshot for good. Cannot be undone. Refused while
        a check is running.
      parameters: [{ $ref: '#/components/parameters/CandidateId' }]
      responses:
        '204':
          description: Deleted.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/WrongRole' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: A check is still running.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: this check is still running; wait for it to finish }

  /v1/candidates/{id}/resume:
    post:
      operationId: uploadResume
      tags: [Candidates]
      summary: Upload a candidate's resume
      description: |
        **Spends a little money** (one model call reads the resume). The PDF goes in the form field `resume`, up to
        5 MB. The projects found wait for confirmation, unless the candidate's role has `auto_confirm`.
      parameters: [{ $ref: '#/components/parameters/CandidateId' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [resume]
              properties:
                resume:
                  type: string
                  format: binary
                  description: The resume as a PDF file, at most 5 MB.
      responses:
        '202':
          description: The resume is being read.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResumeAccepted' }
        '400':
          description: No file in `resume`, an unreadable file, or not a PDF.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: the resume must be a PDF file }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/WrongRole' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: This resume is still being read.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: this resume is still being read }
        '413':
          description: The file is larger than 5 MB.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: the resume file is larger than 5 MB }
        '503':
          description: Resume upload is switched off on this API (no file storage).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: resume upload is not available }

  /v1/candidates/{id}/found:
    get:
      operationId: getFound
      tags: [Candidates]
      summary: What the resume reader found
      description: The projects and coding profiles read from the resume, waiting for the recruiter to confirm or fix them.
      parameters: [{ $ref: '#/components/parameters/CandidateId' }]
      responses:
        '200':
          description: What was found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Found' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/WrongRole' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/candidates/{id}/confirm:
    post:
      operationId: confirmCandidate
      tags: [Candidates]
      summary: Confirm the projects and start the checks
      description: |
        **Spends money.** Sends the final list of projects (what was found, fixed or replaced) and coding profiles,
        then starts checking them. Safe to send again if the first call failed half way.
      parameters: [{ $ref: '#/components/parameters/CandidateId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Confirmation' }
      responses:
        '202':
          description: The checks were queued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfirmStarted' }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/WrongRole' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The candidate is not waiting for confirmation (still reading, or already started).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: this check is not waiting for confirmation }

  /v1/candidates/{id}/progress:
    get:
      operationId: getProgress
      tags: [Candidates]
      summary: Where a candidate's check stands
      parameters: [{ $ref: '#/components/parameters/CandidateId' }]
      responses:
        '200':
          description: Each stage's state, for the candidate and per project.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Progress' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/WrongRole' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/candidates/{id}/report:
    get:
      operationId: getReport
      tags: [Candidates]
      summary: A candidate's proof report
      description: |
        Each resume project's claims with verdicts, scores out of 10, reasons and proof; originality and code history;
        coding-profile signals; flags; the time saved; an interview kit. Proof keys become short-lived `proof_url`s.
      parameters: [{ $ref: '#/components/parameters/CandidateId' }]
      responses:
        '200':
          description: The report.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Report' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/WrongRole' }
        '404':
          description: Not found, not yours, or the report is not ready yet.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: the report is not ready yet }

