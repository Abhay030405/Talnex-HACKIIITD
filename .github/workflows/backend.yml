# Go backend and sandbox host: format, vet and every test, against a real Postgres, local S3 and Docker.
name: backend

on:
  push:
    branches: [main]
    paths: ["backend/**", "sandbox/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "sandbox/**", ".github/workflows/backend.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: talnex
          POSTGRES_PASSWORD: talnex_ci_password
          POSTGRES_DB: talnex_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U talnex -d talnex_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
      s3:
        image: rustfs/rustfs:latest
        env:
          RUSTFS_ACCESS_KEY: talnex_ci_access
          RUSTFS_SECRET_KEY: talnex_ci_secret_key
        ports: ["9000:9000"]
    env:
      TALNEX_TEST_DATABASE_URL: postgres://talnex:talnex_ci_password@localhost:5432/talnex_test?sslmode=disable
      TALNEX_TEST_S3_ENDPOINT: http://localhost:9000
      TALNEX_TEST_S3_ACCESS_KEY: talnex_ci_access
      TALNEX_TEST_S3_SECRET_KEY: talnex_ci_secret_key
      TALNEX_TEST_DOCKER: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Migrate the test database
        run: go run ./cmd/migrate
        env:
          DATABASE_URL: ${{ env.TALNEX_TEST_DATABASE_URL }}
          MIGRATIONS_DIR: migrations
      - name: Build the sandbox base image
        working-directory: .
        run: bash sandbox/host/build_images.sh
      - name: Test
        run: go test -count=1 -p 1 ./...
